# One Render Web Service serves both the app and its WebSocket endpoint.
# Persistent disks require a paid Render instance; without the disk, DATA_DIR is ephemeral.
services:
  - type: web
    name: pixel-battle
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: pixel-battle-data
      mountPath: /var/data
      sizeGB: 1
